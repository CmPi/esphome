ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - lambda: |-
            if (id(g_bl)) {
              id(last_interaction) = millis();
              if (!id(bl_on) ) {
                backlight_on_for_ota(true);
                id(bl_on) = true;
              }
            }
        - if:
            condition:
              lambda: |-
                return id(g_bl);
            then:
              - script.execute: turn_on_backlight
        - globals.set:
            id: g_ota_pb
            value: '0.0'
    on_progress:
      then:
        - lambda: |-
            id(g_ota_pb) = x;  // x is the progress percentage (0-100)
            id(last_interaction) = millis();
        - component.update:
            id: d_main
    on_end:
      then:
        - globals.set:
            id: g_ota_pb
            value: '-1'
        - lambda: |-
            id(g_ota_pb) = 100;  // x is the progress percentage (0-100)
            id(last_interaction) = millis();
        - component.update:
            id: d_main
    on_error:
      then:
        - globals.set:
            id: g_ota_pb
            value: '-1'
