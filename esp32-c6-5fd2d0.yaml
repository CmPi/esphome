#
# @file h801-1aac90.yaml
# @brief Specific Configuration for a H801 device having ${full_mac} address
# @author CmPi <github.com/CmPi>
#

substitutions:
    device_fn: "ESP32-C6 Minimal"
    device_lc: "5fd2d0"
    full_mac: "5f:d2:d0"
    device_type: "ESP32-C6"
    config_version: "0.1.364"
    ip_0: 192.168.0.235   
    pwr_mode: NONE
    pwr_val: 18dB
    webe_api: !secret webe_api
    webe_usrm: !secret webe_usrm    
    webe_key: !secret webe_key
    room: "desk"
    ws2812_led_gpio: GPIO8  # used by rgb_led package
    
<<: !include devices/esp32-c6.yaml



# Onboard RGB LED (GPIO8) - Now fully corrected for ESP-IDF
light:
  - platform: esp32_rmt_led_strip 
    # REMOVED: rmt_channel: 0 (No longer needed under 'light:')
    pin: GPIO8
    num_leds: 1
    chipset: WS2812 # FIXED: Use 'WS2812' instead of 'WS2812B'
    rgb_order: GRB
    name: "Onboard Status LED"
    id: onboard_rgb

# Onboard BOOT Button (GPIO9)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: True
      # FIX: Moved this option inside the 'pin' block
      ignore_strapping_warning: True 
    name: "Boot Button"

# Add these three blocks to the top level of your YAML
bluetooth_proxy:
  # This enables the device to act as a Bluetooth relay for Home Assistant
  active: True 

esp32_ble_tracker:
  # Enables the radio to scan for advertisements (required for proxy)


