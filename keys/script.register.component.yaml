http_request.post:
  url: "${webe_api}"
  request_headers:
    Content-Type: application/json
  json: |-
    root["cmd"] = "component";
    root["fm"] = "${device_lc}";
    root["id"] = "${sSensorId}";
    root["domain"] = "${sSensorDomain}";
    root["name"] = id(${sSensorId}).get_name();
    char obj_id_buf[128];
    root["api_id"] = id(${sSensorId}).get_object_id_to(obj_id_buf).str();
    char icon_buf[64];
    const char* icon = id(${sSensorId}).get_icon_to(icon_buf);
    root["icon"] = (icon && icon[0]) ? icon : "(undefined)";
    root["unit_of_measurement"] = id(${sSensorId}).get_unit_of_measurement_ref().str();
    root["accuracy_decimals"] = id(${sSensorId}).get_accuracy_decimals();
    root["app"] = "ESPHome";
    root["usrm"] = "${webe_usrm}";
    root["key"] = "${webe_key}";
  capture_response: false
