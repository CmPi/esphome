#
# @file models/rd.yaml
# @brief Device configuration for "Room Device"
# @author CmPi <github.com/CmPi>
# @date creation 2026-01-02
#

substitutions:
  device_type: "rd"
  soc_type: "ESP32S3"
  pwr_mode: NONE
  pwr_val: 20dB
  detected_flash_size: 16MB
  ws2812_led_gpio: GPIO48  # used by rgb_led package
  webe_api: !secret webe_api
  webe_usrm: !secret webe_usrm    
  webe_key: !secret webe_key
  config_version: "0.1.006"

esp32:
  board: esp32-s3-devkitm-1
  variant: $soc_type
  flash_size: ${detected_flash_size}
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_SPIRAM_SUPPORT: y
      CONFIG_SPIRAM: y
      CONFIG_SPIRAM_MODE_OCT: y
      CONFIG_SPIRAM_SPEED_80M: y

psram:
  mode: octal
  speed: 80MHz

packages:
  - !include ../packages/esphome.dio.yaml
  - !include ../packages/wifi-mdns.yaml
  - !include ../packages/api-ota.yaml    
  - !include ../packages/sys-info.yaml    
  - !include ../packages/led-rgb-ws2812.yaml    
  - !include ../packages/webe.yaml


#
# https://www.aliexpress.com/item/1005009554059578.html
# https://github.com/vcc-gnd/YD-ESP32-S3  



# BOOT - GPIO0
# RGB  - GPIO48
# TX   - GPIO43
# RX   - GPIO44



# Two USB-C ports (one for power only, one for power and data). 
# Mounted by windows as:
# USB: USB JTAG/serial debug unit
# COM: USB Single Serial

# Sensors:
# ENS160  Digital Metal-Oxide Multi-Gas Sensor
# LD2450  LD2450 Human Presence Sensor
# SCD40   NDIR CO2 sensor
# SHT40   RH Digital humidity and temperature sensor

# Board: 
# YD-ESP32-23
# 2022-v1.3

