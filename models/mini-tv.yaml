#
# @file models/mini-tv.yaml
# @brief Device configuration for Mini TV
# @author CmPi <github.com/CmPi>
# @date creation 2026-01-02
# @date update 2026-10-17 added sendspin support
#

substitutions:
  device_type: "mini-tv"
  soc_type: "ESP32-C3"
  ip_0: 192.168.0.${host16}   
  pwr_mode: LIGHT
  pwr_val: 20dB
  # detected_flash_size: 4MB
  config_version: "1.2.006"
  # display
  bw_only: false
  bl_supported: 'false'
  real_width: '128'
  real_height: '128'  
  # pages and menus
  bs_select_gpio: GPIO09
  bs_next_gpio: GPIO10
  # status LED GPIO (required by package/status_led.yaml)
  status_led_gpio: GPIO11 
  # does this module with a screen displays cover art from Sendspin? (false by default)
  enable_sendspin: "false"
  sendspin_pkg: !include ../packages/sendspin-image.yaml
  sendspin_off_pkg: !include ../packages/sendspin-image-off.yaml
  # secrets
  webe_api: !secret webe_api
  webe_usrm: !secret webe_usrm    
  webe_key: !secret webe_key

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: ${detected_flash_size}
  framework:
    type: esp-idf

esphome:
  includes:
    - src/met.cpp
    - src/met.h

image:
  - platform: file
    file: images/pulse-128x128.png
    id: default_screensaver_img
    type: RGB565
    resize: "128x128"

packages:
  - !include ../packages/esphome.dio.yaml
  - !include ../packages/wifi-mdns.yaml
  - !include ../packages/api.yaml    
  - !include ../packages/status_led.yaml # do not forget to define status_led_gpio in substitutions
  - !include ../packages/met.yaml
  - !include ../packages/min-info.yaml
# - !include ../packages/sys-info.yaml
# - !include ../packages/net-info.yaml
  - !include ../packages/display.menu.yaml
  - !include ../packages/display.date-time.yaml
  - !include ../packages/weather.yaml
  - ${ sendspin_pkg if (enable_sendspin | string | lower) == 'true' else sendspin_off_pkg }
# - !include ../packages/bermuda.yaml # for bluetooth scanning (safe for an ESP32-C3)
  - !include ../packages/webe.yaml

# --- SPI BUS -----------------------------------------------------

# --- GLOBALS ---

globals:
  - id: blink_state
    type: bool
    initial_value: 'false'

spi:
  id: spi_bus
  clk_pin: GPIO3        # SCL
  mosi_pin: GPIO4       # SDA
  # No MISO needed for ST7735

# --- DISPLAY -----------------------------------------------------

display:
  - id: d_main
    platform: mipi_spi
    model: ST7735
    rotation: 180
    dimensions:
      width: 128
      height: 160
      pad_width : 2
    color_order: bgr
    invert_colors: false
    cs_pin: 
      number: GPIO2
      ignore_strapping_warning: true
    dc_pin: GPIO0
    reset_pin: GPIO5
    spi_id: spi_bus
    data_rate: 10MHz
    update_interval: 1s

# --- INTERVAL FOR BLINKING ---
interval:
  - interval: 500ms
    then:
      - lambda: |-
          id(blink_state) = !id(blink_state);

# --- BUTTONS -----------------------------------------------------
binary_sensor:
  - id: !extend bs_select
    platform: gpio
    pin:
      number: ${bs_select_gpio}
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
  - id: !extend bs_next
    platform: gpio
    pin:
      number: ${bs_next_gpio}
      mode: INPUT_PULLUP
      inverted: true

# Enable logging

mdns:
  disabled: false

logger:
  <<: !include ../keys/logger.none.yaml  
