#
# @file models/cam.yaml
# @brief Device configuration for Mini TV
# @author CmPi <github.com/CmPi>
# @date creation 2026-01-02
#

substitutions:
  device_type: "cam"
  board: "esp32cam"
  soc_type: "ESP32"
  ip_0: 192.168.0.${host16}   
  pwr_mode: NONE
  pwr_val: 20dB
  detected_flash_size: 4MB
  config_version: "1.1.10"

esp32:
  board: esp32cam
  framework:
    type: arduino
  flash_size: ${detected_flash_size}

packages:
  - !include ../packages/esphome.dio.yaml
  - !include ../packages/wifi-mdns.yaml
  - !include ../packages/api-ota.yaml    
  - !include ../packages/min-info.yaml  

psram:
  mode: quad
  speed: 80MHz

i2c:
  - id: i2c0
    sda: GPIO26
    scl: GPIO27
    scan: false

esp32_camera:
  id: cam_${device_sn}
  name: "ESP32 CAM Photo"
  external_clock:
    pin: 
      number: GPIO0
      ignore_strapping_warning : true
    frequency: 20MHz
  i2c_id: i2c0
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  # Qualité et résolution
  max_framerate: 15 fps
  resolution: 800x600
  jpeg_quality: 30  # 10 = qualité max, 63 = qualité min    
  # Rotation 180°
  vertical_flip: false
  horizontal_mirror: false

output:
  - platform: gpio
    pin: GPIO4
    id: flash_led

light:
  - platform: binary
    output: flash_led
    name: "Flash Lamp"

button:
  # Reboot switch (after OTA for example)
  - platform: restart
    id: b_restart
    name: "Reboot"
    icon: "mdi:restart"
    entity_category: diagnostic
  - platform: template
    name: "Prendre photo ESP32-CAM"
    on_press:
      - homeassistant.service:
          service: camera.snapshot
          data:
            entity_id: camera.cam_${device_sn}
            filename: "/config/www/snapshots/esp32cam_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg"

api:
  services:  # change camera parameters on-the-fly
    - service: camera_set_param
      variables:
        name: string
        value: int
      then:
        - lambda: |-
            bool state_return = false;
            if (("contrast" == name) && (value >= -2) && (value <= 2)) { id(cam_${device_sn}).set_contrast(value); state_return = true; }

            // Vertical flip: 0 or 1
            if (("vertical_flip" == name) && (value >= 0) && (value <= 1)) {
              id(cam_${device_sn}).set_vertical_flip(value);
              state_return = true;
            }
            // Horizontal mirror: 0 or 1
            if (("horizontal_mirror" == name) && (value >= 0) && (value <= 1)) {
              id(cam_${device_sn}).set_horizontal_mirror(value);
              state_return = true;
            }

            if (true == state_return) {
              id(cam_${device_sn}).update_camera_parameters();
            }

# Example configuration entry
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot