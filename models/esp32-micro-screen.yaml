#
# @file .device.esp32-micro-screen.yaml
# @brief Configuration for an ESP32-C3 with OLED screen 
# @author CmPi <cmpi@webe.fr>
#

esphome:
  <<: !include .def.esphome.common.yaml
  platformio_options:
    board_build.flash_mode: dio
    board_build.flash_size: 4MB

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

<<: !include .def.common.esp32-c3.yaml

# I2C for the screen (GPIO5=SDA, GPIO6=SCL)
i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true

# Enable logging
logger:
  <<: !include .logger.error.yaml  

globals:
  - id: http_rsp_body
    type: std::string
    restore_value: no

binary_sensor:
  - platform: status
    name: "Status"
    id: ha_sts
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Boot"
    id: b_boot
    on_press:
      then:
        - light.toggle: l_led       

sensor:
  - <<: !include .sensor.uptime.yaml
  - <<: !include .sensor.wifi_signal.yaml   
  - <<: !include .sensor.cpu_temperature.yaml   
  
text_sensor:
  - <<: !include .text_sensor.wifi_info.yaml
  - <<: !include .text_sensor.version.yaml 

output:
  - platform: gpio
    pin:
      number: GPIO08
    inverted: true      
    id: o_led   

# 0.42" OLED Display (128x64)
display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    rotation: 0
    contrast: 1
    update_interval: 3s  # Changed from 1s
    flip_x: false
    flip_y: false
    offset_x: 0
    offset_y: 0
    lambda: |-
      it.printf(  30, 12, id(font1), TextAlign::TOP_LEFT, "%.0f°C", id(cpu_temp).state);
      it.printf( 102, 12, id(font1), TextAlign::TOP_RIGHT, "%s", id(ha_sts).state ? "OK" : "NO");
      it.printf(  66, 24, id(font1), TextAlign::TOP_CENTER, "%s", id(ip).state.c_str() );
      float uptime = id(ontime).state;
      if (uptime < 3600) {
        it.printf(30, 36, id(font1), "%.0fm", uptime/60);  // minutes
      } else if (uptime < 86400) {
        it.printf(30, 36, id(font1), "%.1fh", uptime/3600);  // hours
      } else {
        it.printf(30, 36, id(font1), "%.1fd", uptime/86400);  // days
      }
      it.printf( 102, 36, id(font1), TextAlign::TOP_RIGHT, "%.0fdBm", id(rssi).state);

font:
  - file: "fonts/Roboto-Regular.ttf"
    id: font1
    size: 10

light:
  - <<: !include .light.status_led.yaml

button:
  - <<: !include .button.restart.yaml


switch:
  - <<: !include .switch.status_led.yaml

script:
  - id: device_start
    then:
    - delay: 1ms
  - id: declare_config
    then:
    - delay: 1ms      
  - id: report_uptime
    then:
    - delay: 1ms    
