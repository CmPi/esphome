substitutions:
    device_model: "mini-tv"
    device_fn: "ESP32-TV (TFT)"
    device_lc: "5b6ca0"
    soc_type: "ESP32-C3"
    config_version: "0.1.357"
    ip_0: 192.168.0.230
    pwr_mode: LIGHT
    pwr_val: 20dB
    webe_api: !secret webe_api
    webe_usrm: !secret webe_usrm    
    webe_key: !secret webe_key
    detected_flash_size: 4MB
    room: salon
    # display
    bw_only: false
    bl_supported: 'false'
    # pages and menus
    bs_select_gpio: GPIO09
    bs_next_gpio: GPIO10
    # status LED GPIO (required by package/status_led.yaml)
    status_led_gpio: GPIO11 

<<: !include models/mini-tv.yaml  



